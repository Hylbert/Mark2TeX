[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mark2tex"
version = "0.3.1"
description = "Markdown to TeX/PDF with TUI and Docker"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hylbert Rodrigues" }]
dependencies = [
  "textual>=0.58.0",
  "watchdog>=4.0.0",
  "docker>=7.0.0",
  "rich>=13.0.0",
  "pillow>=10.0.0",
  "platformdirs>=4.0.0",
  "pyperclip>=1.8.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260408",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
mark2tex = "mark2tex.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mark2tex*"]

[tool.setuptools.package-data]
"mark2tex" = [
  "Dockerfile",
  "bin/*.sh",
  "templates/**/*",
  "assets/**/*",
  "styles.tcss",
]

# ── Pytest ──────────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# ── Coverage ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["mark2tex"]
omit = [
  "mark2tex/__main__.py",
  "mark2tex/assets/*",
  "mark2tex/app.py",
  "mark2tex/logo_renderer.py"
]

[tool.coverage.report]
show_missing = true
fail_under = 40

# ── Ruff ────────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

# ── Mypy ────────────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
