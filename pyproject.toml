[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mark2tex"
version = "0.1.0"
description = "Markdown to TeX/PDF with TUI and Docker"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hylbert Rodrigues" }]
dependencies = [
  "textual>=0.58.0",
  "watchdog>=4.0.0",
  "docker>=7.0.0",
  "rich>=13.0.0",
  "pillow>=10.0.0"
]

[project.scripts]
mark2tex = "src.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
