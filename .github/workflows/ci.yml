name: CI

on:
  push:
    branches: [develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install development tools
        run: pip install ruff mypy pytest pytest-asyncio pytest-cov coveralls

      - name: Install package in editable mode
        run: pip install -e .

      - name: Lint — ruff
        run: ruff check mark2tex/

      - name: Type check — mypy
        run: mypy mark2tex/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=mark2tex --cov-report=term-missing --cov-report=lcov --cov-fail-under=50

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  build-package:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
