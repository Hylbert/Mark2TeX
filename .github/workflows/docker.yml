name: Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache de layers Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login no Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem (develop/PR — load local)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mark2tex:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build da imagem (main — push Docker Hub)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mark2tex:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mark2tex:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Mover cache (evita crescimento infinito)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Smoke test — pdflatex disponível
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: docker run --rm mark2tex:latest bash -c "which pdflatex && pdflatex --version"

      - name: Smoke test — xelatex disponível
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: docker run --rm mark2tex:latest bash -c "which xelatex && xelatex --version"

      - name: Smoke test — pandoc disponível
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: docker run --rm mark2tex:latest bash -c "which pandoc && pandoc --version"
