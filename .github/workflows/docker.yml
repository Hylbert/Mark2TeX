name: Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache de layers Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build da imagem mark2tex:latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mark2tex:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Mover cache (evita crescimento infinito)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Smoke test — pdflatex disponível
        run: docker run --rm mark2tex:latest bash -c "which pdflatex && pdflatex --version"

      - name: Smoke test — xelatex disponível
        run: docker run --rm mark2tex:latest bash -c "which xelatex && xelatex --version"

      - name: Smoke test — pandoc disponível
        run: docker run --rm mark2tex:latest bash -c "which pandoc && pandoc --version"
