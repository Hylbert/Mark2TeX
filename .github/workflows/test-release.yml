name: Test Release

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão do GitHub Actions
  push:
    tags:
      - "v*.*.*-test" # Tags que terminam em -test disparam a versão de teste

jobs:
  publish-test:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Publicar no TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Criar GitHub Release de Teste
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
